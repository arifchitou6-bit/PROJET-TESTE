<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&display=swap" rel="stylesheet">
    <title>ARIF STUDIO</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Bricolage Grotesque", sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        
        }

        .card {
            background-color: white;
            width: 380;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0, 2);
            transition: 0.3s;
        }

        .card:hover{
            transform: translateY(-5px);
        }

        .card img{
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1{
            color: #0f172a;
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2{
            color: #334155;
            font-size: 22px;
            margin-bottom: 10px;
        }

        p{
            color: #475569;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .buttons{
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .buttons a{
            text-decoration: none;
            background-color: #0f172a;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .buttons a:hover{
            background-color: #1e293b;
            transition: scale(1.05);
        }

        .skills{
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .skill-card{
            background-color: #e2e8f0;
            color: #0f172a;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
 <div class="card">
    <img src="https://static.fanpage.it/wp-content/uploads/sites/14/2021/05/drake-best-rap-song.jpg"
    alt="photo de profil">
    <h1>ARIF CHITOU</h1>
    <h2>Arif CHITOU</h2>
    <h3>Développeur Web et Créateur de Contenu</h3>
    <p>J'apprend le Développement web preogressivement
        et je suis un créateur de contenu sur tiktok.
    </p>
    <div class="buttons">
        <a href="https://www.tiktok.com/@ghost_foot10?is_from_webapp=1&sender_device=pc"
        target="_blank">
            Mon tiktok 
        </a>
        <a href="arifchitou@gmail.com">
            Me contacter
        </a>
    </div>
    <div class="skills">
        <div class="skill-card">
            html
        </div>
        <div class="skill-card">
            css
        </div>
    </div>
 </div>
</body>
</html>
